<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Webhook Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;

}

.header {

    background: #111827;
    color: white;
    padding: 22px 30px;

}

.header h1 {

    margin: 0;
    font-size: 24px;

}

.container {

    max-width: 1200px;
    margin: auto;
    padding: 30px;

}

.topbar {

    display: flex;
    justify-content: space-between;
    align-items: center;

    background: white;

    padding: 18px 20px;

    border-radius: 10px;

    margin-bottom: 20px;

}

.status {

    color: #15803d;
    font-weight: bold;

}

.count {

    background: #eef2ff;
    color: #4338ca;

    padding: 8px 15px;

    border-radius: 20px;

    font-weight: bold;

}

.empty {

    background: white;

    padding: 60px;

    text-align: center;

    border-radius: 10px;

    color: #6b7280;

}

.card {

    background: white;

    border-radius: 10px;

    margin-bottom: 15px;

    padding: 20px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.06);

}

.card-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 15px;

}

.webhook-title {

    font-weight: bold;

    color: #111827;

}

.timestamp {

    color: #6b7280;

    font-size: 13px;

}

pre {

    background: #f8fafc;

    border: 1px solid #e5e7eb;

    padding: 15px;

    border-radius: 8px;

    overflow-x: auto;

    margin: 0;

}

</style>

</head>


<body>


<div class="header">

    <h1>Webhook Live Dashboard</h1>

</div>


<div class="container">


    <div class="topbar">

        <div class="status">

            ● Webhook Listener Active

        </div>


        <div
            class="count"
            id="count">

            0 Events

        </div>

    </div>


    <div id="records">

        <div class="empty">

            Waiting for webhook data...

        </div>

    </div>


</div>


<script>

async function loadWebhookData() {

    try {

        const response =
            await fetch(
                "/api/data",
                {
                    cache: "no-store"
                }
            );


        const records =
            await response.json();


        document.getElementById(
            "count"
        ).textContent =
            records.length + " Events";


        const container =
            document.getElementById(
                "records"
            );


        if (records.length === 0) {

            container.innerHTML =
                '<div class="empty">' +
                'Waiting for webhook data...' +
                '</div>';

            return;

        }


        container.innerHTML = "";


        records.forEach(
            (record, index) => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "card";


                const header =
                    document.createElement(
                        "div"
                    );

                header.className =
                    "card-header";


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "webhook-title";

                title.textContent =
                    "Webhook Event #" +
                    (records.length - index);


                const timestamp =
                    document.createElement(
                        "div"
                    );

                timestamp.className =
                    "timestamp";

                timestamp.textContent =
                    record.receivedTime;


                header.appendChild(
                    title
                );

                header.appendChild(
                    timestamp
                );


                const data =
                    document.createElement(
                        "pre"
                    );

                data.textContent =
                    JSON.stringify(
                        record.data,
                        null,
                        2
                    );


                card.appendChild(
                    header
                );

                card.appendChild(
                    data
                );


                container.appendChild(
                    card
                );

            }
        );


    }

    catch (error) {

        console.error(
            "Error loading data:",
            error
        );

    }

}


loadWebhookData();


// Refresh dashboard every 2 seconds
setInterval(
    loadWebhookData,
    2000
);

</script>


</body>

</html>
